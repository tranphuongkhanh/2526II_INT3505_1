openapi: 3.0.0
info:
  title: Book Management API
  version: 0.0.0
tags: []
paths:
  /books:
    get:
      operationId: getBooks
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      operationId: createBook
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
  /books/{id}:
    get:
      operationId: getBookById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Book'
                  - $ref: '#/components/schemas/Error'
    put:
      operationId: updateBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
    delete:
      operationId: deleteBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message
components:
  schemas:
    Book:
      type: object
      required:
        - title
        - author
        - status
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        author:
          type: string
        status:
          type: string
          enum:
            - available
            - borrowed
    BookInput:
      type: object
      required:
        - title
        - author
        - status
      properties:
        title:
          type: string
        author:
          type: string
        status:
          type: string
          enum:
            - available
            - borrowed
    Error:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
